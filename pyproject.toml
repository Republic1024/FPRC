[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fprc"
version = "0.1.0"
description = "Field-Preserving Residual Closure with XGBoost and optional Pure Gain"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "pandas>=2,<3", "scikit-learn>=1.3,<2",
  "xgboost>=2,<4", "joblib>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fprc = ["py.typed"]
